name: weekly update

on:
  schedule:
    - cron: "0 5 * * 5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run the full pipeline but skip the pushes
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: weekly-update

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::796778066192:role/gha_eyeballvul_updater
          aws-region: us-east-1

      - name: Launch updater instance
        id: launch
        env:
          GH_PAT: ${{ secrets.EYEBALLVUL_UPDATE_PAT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/scripts/launch_update.sh

      - name: Wait for the three repos to be updated
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: .github/scripts/wait_for_update.sh "${{ steps.launch.outputs.instance_id }}" "${{ steps.launch.outputs.start_time }}"

      - name: Terminate instance if still running
        if: always() && steps.launch.outputs.instance_id != ''
        run: aws ec2 terminate-instances --instance-ids "${{ steps.launch.outputs.instance_id }}" || true
