[tool.poetry]
name = "eyeballvul"
version = "0.7.0"
description = ""
authors = ["Timothee Chauvin <timothee.chauvin28@gmail.com>"]
readme = "README.md"
packages = [{ include = "eyeballvul" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
fire = "^0.7.1"
requests = "^2.34.2"
typeguard = "^4.6.0"
pydantic = "^2.13.4"
ortools = "^9.15.6755"
sqlmodel = "^0.0.39"
litellm = "^1.97.0"
tomli = "^2.4.1"
types-pyyaml = "^6.0.12.20260815"

[tool.poetry.scripts]
ev = "eyeballvul.cli:main"

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.6.2"
pytest = "^9.1.1"
mypy = { extras = ["types-all"], version = "^2.3.1" }
types-requests = "^2.33.0.20260712"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.docformatter]
wrap-summaries = 100
wrap-descriptions = 100
pre-summary-newline = true

[tool.bandit]
skips = [
  "B404", # Consider possible security implications associated with the subprocess module
  "B603", # subprocess_without_shell_equals_true: subprocess call - check for execution of untrusted input
  "B607", # Starting a process with a partial executable path
]
[tool.bandit.assert_used]
skips = ['*_test.py', '*/test_*.py']
